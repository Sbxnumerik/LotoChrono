name: Compiler LotoChrono 2.0 APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer les sources Android depuis le depot
        shell: bash
        run: |
          set -euo pipefail
          cat source-bundle/part-aa.txt source-bundle/part-ab.txt source-bundle/part-ac.txt | base64 --decode > /tmp/loto-source.tar.xz
          echo "f6f10f14edf4288b2d5fd1494f32e899e5013aec0d69b6a8c609ffbfe4e55915  /tmp/loto-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/loto-source.tar.xz
          test -f app/src/main/java/fr/lotochrono/MainActivity.java
      - name: Appliquer V2.0 depuis V1.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/fr/lotochrono/SpeechCommandParser.java')
          s=p.read_text()
          pattern=r'(?s)(\bpublic\s+static\s+boolean\s+isFalseWinnerCommand\s*\(\s*String\s+\w+\s*\)\s*\{).*?(\n\s*\}\s*)(?=public\s+static\s+boolean\s+isWinnerCommand)'
          replacement='''public static boolean isFalseWinnerCommand(String transcript) {
                  if (transcript == null) return false;
                  String text = " " + FrenchNumberParser.normalize(transcript) + " ";
                  return text.contains(" il s est trompe ")
                      || text.contains(" il c est trompe ")
                      || text.contains(" elle s est trompee ")
                      || text.contains(" elle c est trompee ")
                      || text.contains(" elle s est trompe ")
                      || text.contains(" elle c est trompe ")
                      || text.contains(" c est une erreur ")
                      || text.contains(" c est un erreur ")
                      || text.contains(" s est trompe ")
                      || text.contains(" c est trompe ");
              }

              '''
          s,count=re.subn(pattern,lambda m:replacement,s,count=1)
          if count!=1: raise RuntimeError('Original V1.2 correction method missing')
          p.write_text(s)
          main=Path('app/src/main/java/fr/lotochrono/MainActivity.java')
          m=main.read_text()
          for token in ('SpeechCommandParser.isFalseWinnerCommand(spoken)', 'winnerShown = true;', 'winnerShown = false;', 'setPaused(true);', 'setPaused(false);'):
              if token not in m: raise RuntimeError('Missing V1.2 voice control: '+token)
          g=Path('app/build.gradle')
          v=g.read_text()
          v,n=re.subn(r'versionCode\s+3\b','versionCode 8',v,count=1)
          if n!=1: raise RuntimeError('Expected V1.2 versionCode 3')
          v,n=re.subn(r"versionName\s+['\x22]1\.2\.0-beta['\x22]","versionName '2.0'",v,count=1)
          if n!=1: raise RuntimeError('Expected V1.2 versionName')
          g.write_text(v)
          print('V2.0 patch applied to V1.2')
          PY
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurer Android SDK existant
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Installer plateforme Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publier APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: LotoChrono-V2-0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
