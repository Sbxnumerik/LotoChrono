name: Compiler LotoChrono 2.0 APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer les sources Android depuis le depot
        shell: bash
        run: |
          set -euo pipefail
          cat source-bundle/part-aa.txt source-bundle/part-ab.txt source-bundle/part-ac.txt | base64 --decode > /tmp/loto-source.tar.xz
          echo "f6f10f14edf4288b2d5fd1494f32e899e5013aec0d69b6a8c609ffbfe4e55915  /tmp/loto-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/loto-source.tar.xz
          test -f app/src/main/java/fr/lotochrono/MainActivity.java
      - name: Appliquer V2.0 depuis V1.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/fr/lotochrono/SpeechCommandParser.java')
          s=p.read_text()
          if 'isFalseWinnerCommand(' not in s:
              pos=s.rfind('}')
              if pos<0: raise RuntimeError('Invalid SpeechCommandParser class')
              method='''    public static boolean isFalseWinnerCommand(String transcript) {
                  if (transcript == null) return false;
                  String text = " " + FrenchNumberParser.normalize(transcript) + " ";
                  return text.contains(" il s est trompe ")
                      || text.contains(" il c est trompe ")
                      || text.contains(" elle s est trompee ")
                      || text.contains(" elle c est trompee ")
                      || text.contains(" elle s est trompe ")
                      || text.contains(" elle c est trompe ")
                      || text.contains(" c est une erreur ")
                      || text.contains(" s est trompe ");
              }
          '''
              s=s[:pos]+method+s[pos:]
          p.write_text(s)
          m=Path('app/src/main/java/fr/lotochrono/MainActivity.java')
          t=m.read_text()
          if 'private boolean winnerShown' not in t:
              t=t.replace('public class MainActivity extends Activity implements RecognitionListener {','public class MainActivity extends Activity implements RecognitionListener {\n    private boolean winnerShown = false;\n    private long lastVoiceCommandAt = 0;',1)
          # Preserve the V1.2 dispatcher and winner overlay; add only voice corrections.
          # The previous replacement lost the original UI lifecycle.
          if 'SpeechCommandParser.isFalseWinnerCommand(spoken)' not in t:
              t=t.replace('boolean winner = SpeechCommandParser.isWinnerCommand(spoken);',
                          'boolean winner = SpeechCommandParser.isWinnerCommand(spoken);\n            boolean falseWinner = SpeechCommandParser.isFalseWinnerCommand(spoken);',1)
          # Show winner before pausing; pausing triggers renderScreen().
          t=t.replace('setPaused(true);\n                    winnerShown = true;',
                      'winnerShown = true;\n                    setPaused(true);')
          # Ensure winner screen is above flash and main controls.
          t=t.replace('winnerOverlay.setVisibility(winnerShown ? View.VISIBLE : View.GONE);',
                      'winnerOverlay.setVisibility(winnerShown ? View.VISIBLE : View.GONE);\n            if (winnerShown) winnerOverlay.bringToFront();')
          # No audio stop on winner screen; preserve microphone loop from V1.2.
          if 'winnerOverlay.setVisibility(winnerShown ? View.VISIBLE : View.GONE);' not in t:
              raise RuntimeError('Winner overlay of V1.2 missing: refusing build')
          if 'winnerNumber.setTag("winnerNumber");' not in t:
              raise RuntimeError('Winner number view missing: refusing build')
          if 'winnerShown = true;' not in t:
              raise RuntimeError('Winner voice action missing: refusing build')
          partial=t.find('    @Override public void onPartialResult(')
          if partial>=0:
              prefix=t[:partial]
              suffix=t[partial:]
              suffix=suffix.replace('if (SpeechCommandParser.isWinnerCommand(spoken)) {',
                                    'if (SpeechCommandParser.isWinnerCommand(spoken) || SpeechCommandParser.isFalseWinnerCommand(spoken)) {',1)
              t=prefix+suffix
          m.write_text(t)
          g=Path('app/build.gradle')
          v=g.read_text()
          v=re.sub(r'versionCode\s+\d+','versionCode 8',v)
          v=re.sub(r'versionName\s+[\x27\x22][^\x27\x22]+[\x27\x22]',"versionName '2.0'",v)
          g.write_text(v)
          print('V2.0 correction commands applied')
          PY
      - name: Verifier la compilation du parseur Java
        run: |
          mkdir -p /tmp/loto-java
          javac -d /tmp/loto-java app/src/main/java/fr/lotochrono/FrenchNumberParser.java app/src/main/java/fr/lotochrono/SpeechCommandParser.java
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurer Android SDK existant
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Installer plateforme Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publier APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: LotoChrono-V2-0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
