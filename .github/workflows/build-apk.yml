name: Compiler Loto Chrono APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer les sources Android
        shell: bash
        run: |
          cat source-bundle/part-aa.txt source-bundle/part-ab.txt source-bundle/part-ac.txt | base64 --decode > /tmp/loto-source.tar.xz
          echo "f6f10f14edf4288b2d5fd1494f32e899e5013aec0d69b6a8c609ffbfe4e55915  /tmp/loto-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/loto-source.tar.xz
          test -f app/src/main/java/fr/lotochrono/MainActivity.java
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
      - name: Installer plateforme Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler Loto Chrono
        run: gradle --no-daemon :app:assembleDebug
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: LotoChrono-V1-1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
