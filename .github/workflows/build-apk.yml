name: Compiler LotoChrono 2.0 APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer les sources Android depuis le depot
        shell: bash
        run: |
          set -euo pipefail
          cat source-bundle/part-aa.txt source-bundle/part-ab.txt source-bundle/part-ac.txt | base64 --decode > /tmp/loto-source.tar.xz
          echo "f6f10f14edf4288b2d5fd1494f32e899e5013aec0d69b6a8c609ffbfe4e55915  /tmp/loto-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/loto-source.tar.xz
          test -f app/src/main/java/fr/lotochrono/MainActivity.java
      - name: Version 2.0 depuis les sources originales 1.2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/fr/lotochrono/SpeechCommandParser.java')
          s=p.read_text()
          start=s.index('    public static boolean isFalseWinnerCommand(')
          end=s.index('    public static boolean isWinnerCommand(',start)
          s=s[:start]+'''    public static boolean isFalseWinnerCommand(String transcript) {
              if (transcript == null) return false;
              String text = " " + FrenchNumberParser.normalize(transcript) + " ";
              return text.contains(" il s est trompe ")
                  || text.contains(" il c est trompe ")
                  || text.contains(" elle s est trompee ")
                  || text.contains(" elle s est trompe ")
                  || text.contains(" elle c est trompee ")
                  || text.contains(" elle c est trompe ")
                  || text.contains(" s est trompe ")
                  || text.contains(" c est trompe ")
                  || text.contains(" c est une erreur ")
                  || text.contains(" c est un erreur ");
          }

          '''+s[end:]
          p.write_text(s)
          main=Path('app/src/main/java/fr/lotochrono/MainActivity.java')
          m=main.read_text()
          # Only the countdown pauses on a winner. Do not stop the audio recorder.
          assert 'setPaused(true);' in m and 'winnerShown = true;' in m
          assert 'winnerShown = false;' in m and 'setPaused(false);' in m
          assert 'stopMicrophone();' not in m[m.index('    private void setPaused('):m.index('    private void acceptRecognizedNumber(')]
          assert 'stopMicrophone();' not in m[m.index('    private void processTranscript('):m.index('    @Override protected void onStart()',m.index('    private void processTranscript('))]
          m=m.replace('Met le chrono en pause et coupe le micro jusqu\'a une reprise manuelle.',
                      'Met uniquement le chrono en pause : le micro continue a ecouter.')
          main.write_text(m)
          g=Path('app/build.gradle')
          v=g.read_text()
          assert "versionCode 3" in v and "versionName '1.2.0-beta'" in v, 'Sources non conformes a V1.2'
          v=v.replace('versionCode 3','versionCode 8').replace("versionName '1.2.0-beta'","versionName '2.0'")
          g.write_text(v)
          print('V2.0: base V1.2 + phrases vocales; microphone maintenu sur GAGNANT')
          PY
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurer Android SDK existant
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Installer plateforme Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publier APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: LotoChrono-V2-0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
