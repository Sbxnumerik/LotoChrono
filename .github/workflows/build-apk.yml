name: Compiler LotoChrono 1.3.3 APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer les sources Android depuis le depot
        shell: bash
        run: |
          set -euo pipefail
          cat source-bundle/part-aa.txt source-bundle/part-ab.txt source-bundle/part-ac.txt | base64 --decode > /tmp/loto-source.tar.xz
          echo "f6f10f14edf4288b2d5fd1494f32e899e5013aec0d69b6a8c609ffbfe4e55915  /tmp/loto-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/loto-source.tar.xz
          test -f app/src/main/java/fr/lotochrono/MainActivity.java
      - name: Appliquer les ameliorations V1.3
        run: python3 scripts/upgrade_v13.py
      - name: Appliquer le visuel et le logo V1.3.1
        run: python3 scripts/upgrade_v131.py
      - name: Appliquer le visuel approuve V1.3.2
        run: python3 scripts/upgrade_v132.py
      - name: Reconstruire les deux ecrans V1.3.3 et proteger l'ecoute
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/fr/lotochrono/MainActivity.java')
          s=p.read_text()
          # Recreate winner screen rather than using the old emoji/title stack.
          start=s.index('        winnerOverlay = new FrameLayout(this);')
          end=s.index('        renderScreen();',start)
          winner='''        winnerOverlay = new FrameLayout(this);
                  winnerOverlay.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                      new int[]{Color.rgb(102,0,0), Color.rgb(206,0,0), Color.rgb(121,0,0)}));
                  LinearLayout winnerContent = new LinearLayout(this);
                  winnerContent.setOrientation(LinearLayout.VERTICAL);
                  winnerContent.setGravity(Gravity.CENTER);
                  winnerContent.setPadding(dp(10), dp(15), dp(10), dp(22));
                  TextView trophy = label("🏆", landscape ? 76 : 100, Color.rgb(255,211,0), true);
                  trophy.setGravity(Gravity.CENTER);
                  winnerContent.addView(trophy, new LinearLayout.LayoutParams(-1, 0, 1.2f));
                  TextView winnerTitle = label("GAGNANT !", landscape ? 55 : 54, Color.rgb(255,226,0), true);
                  winnerTitle.setGravity(Gravity.CENTER);
                  winnerTitle.setShadowLayer(dp(4), dp(3), dp(5), Color.rgb(40,0,0));
                  winnerTitle.setSingleLine(true);
                  winnerTitle.setAutoSizeTextTypeUniformWithConfiguration(22, landscape ? 58 : 54, 1, TypedValue.COMPLEX_UNIT_SP);
                  winnerContent.addView(winnerTitle, new LinearLayout.LayoutParams(-1, 0, 1f));
                  View goldLineTop = new View(this);
                  goldLineTop.setBackground(new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                      new int[]{Color.rgb(150,0,0),Color.rgb(255,228,0),Color.rgb(150,0,0)}));
                  winnerContent.addView(goldLineTop, new LinearLayout.LayoutParams(-1, dp(3)));
                  TextView winnerNumber = label("—", landscape ? 135 : 150, WHITE, true);
                  winnerNumber.setGravity(Gravity.CENTER);
                  winnerNumber.setShadowLayer(dp(5), dp(3), dp(5), Color.rgb(48,0,0));
                  winnerNumber.setSingleLine(true);
                  winnerNumber.setTag("winnerNumber");
                  winnerContent.addView(winnerNumber, new LinearLayout.LayoutParams(-1, 0, 2f));
                  View goldLineBottom = new View(this);
                  goldLineBottom.setBackground(new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                      new int[]{Color.rgb(150,0,0),Color.rgb(255,228,0),Color.rgb(150,0,0)}));
                  winnerContent.addView(goldLineBottom, new LinearLayout.LayoutParams(-1, dp(3)));
                  TextView winnerHint = label("Touchez l'écran pour\\nune nouvelle partie",
                      landscape ? 22 : 24, WHITE, true);
                  winnerHint.setGravity(Gravity.CENTER);
                  winnerContent.addView(winnerHint, new LinearLayout.LayoutParams(-1, 0, 1.1f));
                  winnerOverlay.addView(winnerContent, new FrameLayout.LayoutParams(-1, -1));
                  winnerOverlay.setOnClickListener(v -> confirmNewDraw());
                  screen.addView(winnerOverlay, new FrameLayout.LayoutParams(-1, -1));
          '''
          s=s[:start]+winner+s[end:]
          # Strongly outlined gradients, including timer updates.
          s=s.replace('timerPanel.setBackground(rounded(ready ? GREEN : RED, 20));',
              'timerPanel.setBackground(outlinedPanel(ready ? GREEN : Color.rgb(181,0,20), ready ? Color.rgb(110,255,150) : Color.rgb(255,130,138), 20));')
          s=s.replace('timerPanel.setBackground(rounded(ready ? GREEN : Color.rgb(183, 4, 25), 20));',
              'timerPanel.setBackground(outlinedPanel(ready ? GREEN : Color.rgb(181,0,20), ready ? Color.rgb(110,255,150) : Color.rgb(255,130,138), 20));')
          s=s.replace('TextView chip = label(number, 22, WHITE, true);',
              'TextView chip = label(number, landscape ? 22 : 26, WHITE, true);')
          s=s.replace('chip.setBackground(rounded(mostRecent ? Color.rgb(37, 99, 235)\\n                    : Color.rgb(51, 65, 85), 11));',
              'chip.setBackground(outlinedPanel(mostRecent ? Color.rgb(0,95,245) : Color.rgb(36,54,79), mostRecent ? Color.rgb(84,172,255) : Color.rgb(81,106,143), 11));')
          # Status must be truthful: 0% disables recognition but does not shut down audio capture.
          s=s.replace('statusText.setText("● ÉCOUTE ACTIVE · HORS LIGNE");',
              'statusText.setText("● MICRO ACTIF · HORS LIGNE");')
          # Timer pause and winner state never stop AudioRecord or the recognizer.
          # Foreground watchdog restarts capture after an unexpected audio interruption.
          watchdog='''    private final Runnable microphoneWatchdog = new Runnable() {
                  @Override public void run() {
                      if (foreground && !destroyed && model != null && !listening) startMicrophone();
                      if (!destroyed) handler.postDelayed(this, 2500);
                  }
              };

          '''
          anchor='    @Override protected void onStart() {'
          assert anchor in s
          s=s.replace(anchor,watchdog+anchor,1)
          s=s.replace('        if (model != null) startMicrophone();\\n    }\\n\\n    @Override protected void onStop()',
              '        if (model != null) startMicrophone();\\n        handler.removeCallbacks(microphoneWatchdog);\\n        handler.postDelayed(microphoneWatchdog, 2500);\\n    }\\n\\n    @Override protected void onStop()')
          s=s.replace('    @Override protected void onStop() {\\n        saveDraw();',
              '    @Override protected void onStop() {\\n        handler.removeCallbacks(microphoneWatchdog);\\n        saveDraw();')
          s=s.replace('    @Override protected void onDestroy() {\\n        saveDraw();',
              '    @Override protected void onDestroy() {\\n        handler.removeCallbacks(microphoneWatchdog);\\n        saveDraw();')
          # Keep a landscape-specific, larger central region without changing functionality.
          s=s.replace('content.setPadding(dp(landscape ? 20 : 14), dp(12), dp(landscape ? 20 : 14), dp(landscape ? 18 : 28));',
              'content.setPadding(dp(landscape ? 20 : 9), dp(landscape ? 6 : 12), dp(landscape ? 20 : 9), dp(landscape ? 10 : 28));')
          p.write_text(s)
          g=Path('app/build.gradle')
          v=g.read_text()
          v=re.sub(r'versionCode\\s+\\d+','versionCode 7',v)
          v=re.sub(r'versionName\\s+[\\x27\\x22][^\\x27\\x22]+[\\x27\\x22]',"versionName '1.3.3'",v)
          g.write_text(v)
          assert 'versionCode 7' in v
          print('V1.3.3 screen and microphone watchdog patch applied')
          PY
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurer Android SDK existant
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Installer plateforme Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publier APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: LotoChrono-V1-3-3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
