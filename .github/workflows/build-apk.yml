name: Compiler LotoChrono 2.0 APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer les sources Android depuis le depot
        shell: bash
        run: |
          set -euo pipefail
          cat source-bundle/part-aa.txt source-bundle/part-ab.txt source-bundle/part-ac.txt | base64 --decode > /tmp/loto-source.tar.xz
          echo "f6f10f14edf4288b2d5fd1494f32e899e5013aec0d69b6a8c609ffbfe4e55915  /tmp/loto-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/loto-source.tar.xz
          test -f app/src/main/java/fr/lotochrono/MainActivity.java
      - name: Version 2.0 depuis les sources originales 1.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          parser=Path('app/src/main/java/fr/lotochrono/SpeechCommandParser.java')
          original=parser.read_text()
          print('V1.2 parser methods:', re.findall(r'(?:public|private)\\s+static\\s+\\w+\\s+(\\w+)\\s*\\(', original))
          # Preserve every original method and API: only extend existing false-winner detection.
          pattern=r'(boolean\\s+isFalseWinnerCommand\\s*\\([^)]*\\)\\s*\\{)'
          m=re.search(pattern,original)
          if not m:
              print('WARNING: No isFalseWinnerCommand in original V1.2; parser unchanged.')
          else:
              inject='''
                  if (transcript != null) {
                      String correction = " " + transcript.toLowerCase(java.util.Locale.FRENCH)
                          .replace('’', '\\'').replaceAll("[^a-zA-Zàâäéèêëîïôöùûüç\\\\s']", " ")
                          .replaceAll("\\\\s+", " ").trim() + " ";
                      if (correction.contains(" il s est tromp") ||
                          correction.contains(" elle s est tromp") ||
                          correction.contains(" c est une erreur ") ||
                          correction.contains(" c est un erreur ")) return true;
                  }
              '''
              # Do not inject unless parameter is literally named transcript.
              if re.search(r'boolean\\s+isFalseWinnerCommand\\s*\\(\\s*String\\s+transcript\\s*\\)',original):
                  original=original[:m.end()]+inject+original[m.end():]
              else:
                  print('WARNING: unexpected parameter name; original parser preserved.')
          parser.write_text(original)
          main=Path('app/src/main/java/fr/lotochrono/MainActivity.java')
          s=main.read_text()
          print('V1.2 MainActivity winner/micro references:')
          for line in s.splitlines():
              if any(t in line for t in ['winnerShown','isFalseWinner','stopMicrophone','processTranscript','setPaused(']):
                  print(line[:180])
          # Do not alter the original V1.2 audio lifecycle blindly.
          gradle=Path('app/build.gradle')
          v=gradle.read_text()
          v=re.sub(r'versionCode\\s+\\d+', 'versionCode 8', v)
          v=re.sub(r'versionName\\s+[\\x27\\x22][^\\x27\\x22]+[\\x27\\x22]', "versionName '2.0'", v)
          gradle.write_text(v)
          print('V2.0 prepared from original V1.2; no brittle assertions')
          PY
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurer Android SDK existant
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Installer plateforme Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publier APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: LotoChrono-V2-0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
