name: Compiler LotoChrono 1.2 APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Recuperer les sources de la release Loto_1.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/loto-release /tmp/loto-extract
          gh release download Loto_1.2 --repo "${GITHUB_REPOSITORY}" --pattern '*.zip' --dir /tmp/loto-release
          zipfile=$(find /tmp/loto-release -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$zipfile" || { echo 'Aucun ZIP joint a la release Loto_1.2'; exit 1; }
          unzip -q "$zipfile" -d /tmp/loto-extract
          project=$(find /tmp/loto-extract -type f -path '*/app/build.gradle' -print -quit)
          test -n "$project" || { echo 'Le ZIP ne contient pas app/build.gradle'; exit 1; }
          project_root=$(dirname "$(dirname "$project")")
          cp -a "$project_root"/. .
          test -f app/src/main/java/fr/lotochrono/MainActivity.java
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
      - name: Installer plateforme Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publier APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: LotoChrono-V1-2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
