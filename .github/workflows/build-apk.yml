name: Compiler LotoChrono 2.0 APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer les sources Android depuis le depot
        shell: bash
        run: |
          set -euo pipefail
          cat source-bundle/part-aa.txt source-bundle/part-ab.txt source-bundle/part-ac.txt | base64 --decode > /tmp/loto-source.tar.xz
          echo "f6f10f14edf4288b2d5fd1494f32e899e5013aec0d69b6a8c609ffbfe4e55915  /tmp/loto-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/loto-source.tar.xz
          test -f app/src/main/java/fr/lotochrono/MainActivity.java
      - name: Appliquer V2.0 depuis V1.2 (correctif teste)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          parser=Path('app/src/main/java/fr/lotochrono/SpeechCommandParser.java')
          s=parser.read_text()
          a=s.index('    public static boolean isFalseWinnerCommand(')
          b=s.index('    public static boolean isWinnerCommand(',a)
          s=s[:a]+'''    public static boolean isFalseWinnerCommand(String transcript) {
              if (transcript == null) return false;
              String text = " " + FrenchNumberParser.normalize(transcript) + " ";
              return text.contains(" il s est trompe ")
                  || text.contains(" il c est trompe ")
                  || text.contains(" elle s est trompee ")
                  || text.contains(" elle c est trompee ")
                  || text.contains(" elle s est trompe ")
                  || text.contains(" elle c est trompe ")
                  || text.contains(" c est une erreur ")
                  || text.contains(" c est un erreur ")
                  || text.contains(" s est trompe ")
                  || text.contains(" c est trompe ");
          }

          '''+s[b:]
          parser.write_text(s)
          main=Path('app/src/main/java/fr/lotochrono/MainActivity.java')
          m=main.read_text()
          a=m.index('    private void processTranscript(')
          b=m.index('    @Override protected void onStart()',a)
          assert 'stopMicrophone()' not in m[a:b]
          assert 'winnerShown = true;' in m[a:b]
          assert 'winnerShown = false;' in m[a:b]
          assert 'onPartialResult(String json)' in m
          assert 'SpeechCommandParser.isFalseWinnerCommand(spoken)' in m
          m=m.replace('                } else if (!paused) acceptRecognizedNumber(parsed, true);',
                      '                } else if (!paused && parsed >= 1) acceptRecognizedNumber(parsed, true);')
          main.write_text(m)
          g=Path('app/build.gradle')
          v=g.read_text()
          assert 'versionCode 3' in v and "versionName '1.2.0-beta'" in v
          v=v.replace('versionCode 3','versionCode 8').replace("versionName '1.2.0-beta'","versionName '2.0'")
          g.write_text(v)
          print('V2.0 patch verified against original V1.2')
          PY
      - name: Tester la compilation Java du parseur
        shell: bash
        run: |
          mkdir -p /tmp/loto-parser-test
          javac -d /tmp/loto-parser-test app/src/main/java/fr/lotochrono/FrenchNumberParser.java app/src/main/java/fr/lotochrono/SpeechCommandParser.java
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurer Android SDK existant
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Installer plateforme Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publier APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: LotoChrono-V2-0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
