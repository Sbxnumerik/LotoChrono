name: Compiler LotoChrono V4.0 APK
on:
  workflow_dispatch:
  push:
    branches: [Loto_4.0]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extraire les sources V3.0 deposees sur GitHub
        shell: bash
        run: |
          set -euo pipefail
          test -f LotoChrono_V3.0_sources_corrigees.zip
          unzip -o -q LotoChrono_V3.0_sources_corrigees.zip
          test -f app/src/main/java/fr/lotochrono/MainActivity.java
          test -f app/src/main/java/fr/lotochrono/SpeechCommandParser.java
          grep -q 'winnerNumber' app/src/main/java/fr/lotochrono/MainActivity.java
          grep -q 'versionName' app/build.gradle
      - name: Ajouter les deux visuels V4 aux ressources Android
        shell: bash
        run: |
          set -euo pipefail
          test -s Interface.png
          test -s Gagnant.png
          mkdir -p app/src/main/res/drawable-nodpi
          cp Interface.png app/src/main/res/drawable-nodpi/v4_interface.png
          cp Gagnant.png app/src/main/res/drawable-nodpi/v4_gagnant.png
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verifier le parseur vocal
        run: |
          mkdir -p /tmp/loto-java
          javac -d /tmp/loto-java app/src/main/java/fr/lotochrono/FrenchNumberParser.java app/src/main/java/fr/lotochrono/SpeechCommandParser.java
      - name: Installer plateforme Android 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler LotoChrono V3.0
        run: gradle --no-daemon :app:assembleDebug
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: LotoChrono-V4-0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
